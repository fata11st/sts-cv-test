name: CI — Lint, Tests & Dataset Reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib==3.11.2 numpy==2.5.5 pillow==13.0.0 PyYAML==6.0.4 pytest==9.2.0 ruff==0.17.6

      - name: Lint code with ruff
        run: ruff check src tests

      - name: Run unit tests
        run: pytest -v

      - name: Reproduce dataset preparation and verify manifest
        run: |
          python -m src.prepare_dataset --input test_data/traffic_v5_mini --output data/processed --seed 42
          python -m src.validate_labels --input data/processed --reference-classes test_data/traffic_v5_mini/classes.txt --strict
          python -m src.prepare_dataset --verify-manifest reports/manifest.sha256
          git diff --exit-code reports/dataset_report.md reports/manifest.sha256

      - name: Ensure no hardcoded absolute paths in tracked files
        run: |
          if git grep -nE '(/[U]sers/|/[h]ome/|[C]:\\)'; then
            echo "Found forbidden absolute path!"
            exit 1
          fi
